{% extends "rentals/base.html" %}

{% block content %}
  <section class="operations-section">
    <div class="operations-inner">
      <h1 class="operations-title">Operations</h1>
    </div>

    <div class="operations-actions">
        <a
              href="{% url 'pull_vrbo_calendar' %}"
              class="btn btn-primary"
            >
              Refresh VRBO Calendar
        </a>
        <!-- upload excel file with reservations from Ali's spreadsheet  -->
        <p>&nbsp;</p>
            <form method="post" action="{% url 'upload_accounting_file' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <label for="excel_file">Upload Ali's spreadsheet here:</label>
                <input type="file" name="excel_file" id="excel_file" class="btn btn-primary">
                <button type="submit" class="btn btn-primary">Upload</button>
            </form>

    </div>
  </section>
{% endblock %}
